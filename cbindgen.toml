language = "C"
include_guard = "URBIX_H"
tab_width = 4
style = "both"

# Content inserted before auto-generated declarations.
header = """\
/* include/urbix.h — Auto-generated by cbindgen. Do not edit manually;
 * regenerate with `cargo build`.
 *
 * See Urbix_Project.md §2.3 (wire format) and §2.4 (FFI surface). */"""

# Trailer is injected by build.rs *inside* the include guard (see build.rs);
# cbindgen's `trailer` would land after `#endif`, so it is kept empty here.

[export]
# Only these types are exported; everything else is hidden from the header.
include = [
    "UrbixEngine",
    "UrbixChunkBuffer",
    "UrbixZoneAffinity",
    "ChunkHeader",
    "Cell",
    "CellFlags",
    "InteriorId",
]
exclude = [
    "ChunkId",
    "ChunkBuffer",
    "ZoneType",
    "ZoneParams",
    "ZoneAffinity",
    "VoronoiDiagram",
    "WorldEngine",
    "SITE_X",
    "SITE_Y",
    "SITE_ZONE",
    "HEIGHT",
    "PALETTE",
    "DENSITY",
    "INTERIOR",
    "INTERIOR_SIZE_W",
    "INTERIOR_SIZE_H",
    "INTERIOR_FOG",
    "INTERIOR_PALETTE",
]

# Rename Rust names to the Urbix-prefixed names used in §2.3.
[export.rename]
"ChunkHeader" = "UrbixChunkHeader"
"Cell" = "UrbixCell"
