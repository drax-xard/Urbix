language = "C"
include_guard = "URBIX_H"
tab_width = 4
style = "both"

# Content inserted before auto-generated declarations.
header = """\
/* include/urbix.h — Auto-generated by cbindgen. Do not edit manually;
 * regenerate with `cargo build`.
 *
 * See Urbix_Project.md §2.3 (wire format) and §2.4 (FFI surface). */"""

# Content inserted after auto-generated declarations.
trailer = """\

/* ---- Compile-time layout checks ---------------------------------------- */
_Static_assert(sizeof(UrbixChunkHeader) == 32, "UrbixChunkHeader must be 32 bytes");
_Static_assert(sizeof(UrbixCell) == 40,      "UrbixCell must be 40 bytes");
_Static_assert(_Alignof(UrbixChunkHeader) == 8, "UrbixChunkHeader must be 8-byte aligned");
_Static_assert(_Alignof(UrbixCell) == 8,       "UrbixCell must be 8-byte aligned");"""

[export]
# Only these types are exported; everything else is hidden from the header.
include = [
    "UrbixEngine",
    "UrbixChunkBuffer",
    "UrbixZoneAffinity",
    "ChunkHeader",
    "Cell",
    "CellFlags",
    "InteriorId",
]
exclude = [
    "ChunkId",
    "ChunkBuffer",
    "ZoneType",
    "ZoneParams",
    "ZoneAffinity",
    "VoronoiDiagram",
    "WorldEngine",
    "SITE_X",
    "SITE_Y",
    "SITE_ZONE",
    "HEIGHT",
    "PALETTE",
    "DENSITY",
    "INTERIOR",
]

# Rename Rust names to the Urbix-prefixed names used in §2.3.
[export.rename]
"ChunkHeader" = "UrbixChunkHeader"
"Cell" = "UrbixCell"
